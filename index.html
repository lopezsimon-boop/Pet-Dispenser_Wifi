<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispensador de Mascotas 🐾</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* BARRA SUPERIOR SIMULADA DE NAVEGADOR */
    .browser-bar {
      background-color: #3b3b3b;
      padding: 8px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .arrows {
      color: #5d9cec;
      font-weight: bold;
      font-size: 18px;
    }

    .address-bar {
      background-color: #5d9cec;
      height: 22px;
      flex-grow: 1;
      border-radius: 12px;
      position: relative;
    }

    .address-bar::after {
      content: '↻';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -55%);
      color: white;
      font-weight: bold;
    }

    .browser-icons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-circle {
      width: 22px;
      height: 22px;
      background-color: #5d9cec;
      border-radius: 50%;
    }

    .dots {
      color: #5d9cec;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* NAVBAR AZUL */
    .navbar {
      background-color: #8198b1;
      padding: 10px 30px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-item {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .nav-item.active {
      border-left: 2px solid #2c3e50;
      border-right: 2px solid #2c3e50;
      padding: 0 15px;
    }

    .auth-btn {
      background-color: #2e4053;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    .user-icon {
      width: 24px;
      height: 24px;
      background-color: #2e4053;
      border-radius: 50%;
    }

    /* CONTENIDO PRINCIPAL */
    .main-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .pet-info-banner {
      text-align: center;
      margin-bottom: 15px;
    }

    .pet-info-banner h1 {
      color: #2c3e50;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .pet-info-banner p {
      color: #555;
      font-size: 14px;
      font-style: italic;
    }

    /* RECUADRO GRIS / CONTENEDOR DE CÁMARA */
    .screen-box {
      width: 100%;
      max-width: 700px;
      height: 320px;
      background-color: #969696;
      border: 1.5px solid #000;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #camStream {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cam-overlay-status {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 15px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.4);
      z-index: 5;
    }

    .cam-setup-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .cam-setup-panel input {
      padding: 8px 12px;
      border-radius: 5px;
      border: 1px solid #ccc;
      text-align: center;
      font-size: 14px;
      width: 220px;
    }

    .cam-setup-panel button {
      padding: 8px 18px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    /* BOTONES DE CONTROL */
    .controls-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 25px;
      width: 100%;
      max-width: 700px;
    }

    .btn-control {
      background-color: #5d9cec;
      color: white;
      border: 1px solid #3b73b9;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0px 3px 5px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
      min-width: 160px;
    }

    .btn-control:active {
      transform: translateY(2px);
      box-shadow: 0px 1px 2px rgba(0,0,0,0.2);
    }

    .btn-control.active {
      background-color: #27ae60;
      border-color: #1e8449;
    }

    .btn-auto {
      margin-bottom: -15px;
    }

    /* FOOTER */
    .footer {
      background-color: #8198b1;
      height: 60px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="browser-bar">
    <div class="arrows">➔ ➔</div>
    <div class="address-bar"></div>
    <div class="browser-icons">
      <div class="icon-circle"></div>
      <div class="dots">⋮</div>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-links">
      <a href="#" class="nav-item">Inicio</a>
      <a href="#" class="nav-item active">Nosotros</a>
      <a href="#" class="nav-item">Proyecto</a>
      <a href="#" class="nav-item">Contacto</a>
    </div>
    <button class="auth-btn">Ingresar</button>
    <button class="auth-btn">Registrarse</button>
    <div class="user-icon"></div>
  </div>

  <div class="main-container">
    
    <div class="pet-info-banner">
      <h1>PetFeeder IoT 🐶🐱</h1>
      <p>"Amor en cada ración. Cuidando a tu mascota estés donde estés." 🐾</p>
    </div>

    <!-- PANTALLA DE VIDEO DE CÁMARA ESP32-CAM -->
    <div class="screen-box" id="screenBox">
      <img id="camStream" src="" alt="Transmisión en vivo">

      <div class="cam-setup-panel" id="camSetup">
        <h3 style="text-shadow: 1px 1px 2px #000;">Cámara del Dispensador 📹</h3>
        <p style="font-size: 13px; text-shadow: 1px 1px 2px #000;">Ingresa la IP asignada a tu ESP32-CAM:</p>
        <input type="text" id="ipInput" placeholder="Ej: 192.168.1.50">
        <button onclick="conectarCamara()">Conectar Video</button>
      </div>

      <div class="cam-overlay-status" id="statusMessage">Estado: Esperando cámara... 🐾</div>
    </div>

    <div class="controls-container">
      <button class="btn-control" id="btnAgua" onclick="toggleAgua()">Agua/Detener</button>
      <button class="btn-control btn-auto" id="btnAuto" onclick="toggleAuto()">Automático</button>
      <button class="btn-control" id="btnComida" onclick="toggleComida()">Comida/Detener</button>
    </div>
  </div>

  <div class="footer"></div>

  <script>
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
    const topicControl = "pet_dispenser_lopezsimon/control";

    let estadoAgua = false;
    let estadoComida = false;
    let estadoAuto = false;

    const statusMsg = document.getElementById('statusMessage');

    client.on('connect', () => {
      console.log('Conectado exitosamente al Broker MQTT global');
    });

    function conectarCamara() {
      const ip = document.getElementById('ipInput').value.trim();
      if(ip !== "") {
        const img = document.getElementById('camStream');
        img.src = "http://" + ip + ":81/stream";
        img.style.display = "block";
        document.getElementById('camSetup').style.display = "none";
        statusMsg.innerHTML = "Transmisión en vivo activa 🟢";
      } else {
        alert("Ingresa una IP válida");
      }
    }

    function toggleAgua() {
      estadoAgua = !estadoAgua;
      const btn = document.getElementById('btnAgua');
      if (estadoAgua) {
        client.publish(topicControl, 'data2=0');
        btn.classList.add('active');
        statusMsg.innerHTML = "Sirviendo Agua a tu mascota... 💧";
      } else {
        client.publish(topicControl, 'data2=1');
        btn.classList.remove('active');
        statusMsg.innerHTML = "Suministro de Agua detenido ⏹️";
      }
    }

    function toggleComida() {
      estadoComida = !estadoComida;
      const btn = document.getElementById('btnComida');
      if (estadoComida) {
        client.publish(topicControl, 'data1=0');
        btn.classList.add('active');
        statusMsg.innerHTML = "Sirviendo Comida a tu mascota... 🍖";
      } else {
        client.publish(topicControl, 'data1=1');
        btn.classList.remove('active');
        statusMsg.innerHTML = "Dispensador de Comida detenido ⏹️";
      }
    }

    function toggleAuto() {
      estadoAuto = !estadoAuto;
      const btn = document.getElementById('btnAuto');
      if (estadoAuto) {
        client.publish(topicControl, 'auto=1');
        btn.classList.add('active');
        statusMsg.innerHTML = "Modo Automático ACTIVADO ⚙️🐾";
      } else {
        client.publish(topicControl, 'auto=0');
        btn.classList.remove('active');
        statusMsg.innerHTML = "Modo Automático DESACTIVADO 🛑";
      }
    }
  </script>

</body>
</html>
