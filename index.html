<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispensador IoT de Mascotas 🐾</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* Títulos */
        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #f1f1f1;
        }

        p.subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }

        .banner-msg {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 30px;
            font-size: 13px;
            color: #ffb74d;
        }

        /* Tarjeta principal con el borde brillante superior */
        .card {
            background-color: #1a1a1a;
            border-radius: 15px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-top: 4px solid #00c853; /* Línea verde superior */
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            color: #e0e0e0;
            margin-bottom: 25px;
        }

        /* Filas de botones */
        .btn-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 16px 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px; /* Estilo ovalado idéntico a la foto */
            cursor: pointer;
            color: white;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Colores de los botones */
        .btn-food {
            background-color: #d84315; /* Naranja/Rojo oscuro */
        }
        .btn-food:hover {
            background-color: #bf360c;
        }

        .btn-water {
            background-color: #0277bd; /* Azul */
        }
        .btn-water:hover {
            background-color: #01579b;
        }

        .btn-stop {
            background-color: #424242; /* Gris */
        }
        .btn-stop:hover {
            background-color: #212121;
        }

        .status-box {
