<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispensador Inteligente de Mascotas 🐾</title>
    <!-- Librería MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff6f61;
            font-size: 26px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .banner-quote {
            background-color: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 10px 15px;
            margin-bottom: 25px;
            border-radius: 5px;
            font-style: italic;
            color: #e65100;
            font-size: 13px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-food {
            background-color: #ff7043;
        }

        .btn-food:hover {
            background-color: #f4511e;
        }

        .btn-water {
            background-color: #29b6f6;
        }

        .btn-water:hover {
            background-color: #0288d1;
        }

        .status-box {
            margin-top: 25px;
            padding: 12px;
            border-radius: 10px;
            background-color: #e8f5e9;
            color: #2e7d32;
            font-size: 14px;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Título y Temática de Mascotas -->
        <h1>PetFeeder IoT 🐶🐱</h1>
        <p class="subtitle">Cuida y alimenta a tu mejor amigo desde cualquier lugar</p>

        <!-- Mensaje / Frase bonita -->
        <div class="banner-quote">
            "Amor en cada ración. Tu mascota feliz, estés donde estés." 🐾
        </div>

        <!-- Botones de Control -->
        <div class="btn-group">
            <button class="btn-food" onclick="sendData('data1=0')">🍖 Servir Comida</button>
            <button class="btn-food" style="background-color: #757575;" onclick="sendData('data1=1')">⏹️ Detener Comida</button>
            
            <button class="btn-water" onclick="sendData('data2=0')">💧 Servir Agua</button>
            <button class="btn-water" style="background-color: #757575;" onclick="sendData('data2=1')">⏹️ Detener Agua</button>
        </div>

        <!-- Estado de la señal -->
        <div class="status-box" id="status">
            Conectado al dispensador de la casa 🟢
        </div>

        <footer>
            Proyecto IoT • Control Remoto ESP32
        </footer>
    </div>

    <!-- Script de comunicación MQTT -->
    <script>
        var client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "web_" + parseInt(Math.random() * 100, 10));

        client.onConnectionLost = onConnectionLost;

        client.connect({onSuccess:onConnect});

        function onConnect() {
            console.log("Conectado a MQTT");
            document.getElementById("status").innerHTML = "Conectado al dispensador 🟢";
            document.getElementById("status").style.backgroundColor = "#e8f5e9";
            document.getElementById("status").style.color = "#2e7d32";
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Conexión perdida:" + responseObject.errorMessage);
                document.getElementById("status").innerHTML = "Reconectando con la mascota... 🔴";
                document.getElementById("status").style.backgroundColor = "#ffebee";
                document.getElementById("status").style.color = "#c62828";
            }
        }

        function sendData(value) {
            var message = new Paho.MQTT.Message(value);
            message.destinationName = "pet_dispenser_lopezsimon/control";
            client.send(message);
        }
    </script>
</body>
</html>

</body>
</html>
