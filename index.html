<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispensador de Mascotas 🐾</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 16px;
        }
        .quote {
            font-style: italic;
            color: #555;
            margin-bottom: 25px;
        }
        button {
            padding: 15px 25px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Control de Dispensador 🐶🐱</h1>
    <p>Cuida y alimenta a tu mascota desde cualquier lugar</p>
    <p class="quote">"Amor en cada ración. Tu mascota feliz, estés donde estés." 🐾</p>

    <div>
        <button onclick="sendData('data1=0')">Comida</button>
        <button onclick="sendData('data1=1')">Detener Comida</button>
    </div>

    <div>
        <button onclick="sendData('data2=0')">Agua</button>
        <button onclick="sendData('data2=1')">Detener Agua</button>
    </div>

    <script>
        var client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "web_" + parseInt(Math.random() * 100, 10));

        client.connect({onSuccess:onConnect});

        function onConnect() {
            console.log("Conectado a MQTT");
        }

        function sendData(value) {
            var message = new Paho.MQTT.Message(value);
            message.destinationName = "pet_dispenser_lopezsimon/control";
            client.send(message);
        }
    </script>

</body>
</html>
